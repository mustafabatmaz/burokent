# Weekly updates. Minor and patch updates arrive as one grouped pull request per ecosystem; major updates arrive
# one by one, so each can be judged on its own. Versions pinned on purpose ignore their major updates below.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint and openapi-typescript do not support TypeScript 7 yet
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node types follow the Node version the apps run on (24, LTS)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Version 9 changed the API; moving to it is its own piece of work
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend/apps/admin-web
      - /frontend/apps/public-web
    schedule:
      interval: weekly
    groups:
      images:
        update-types: [minor, patch]
    ignore:
      # Long-term support lines only: Java 21 and Node 24 until the next LTS is chosen deliberately
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # nginx's stable line has an even minor version (1.30); odd ones are mainline
      - dependency-name: nginxinc/nginx-unprivileged
        update-types: ["version-update:semver-minor"]
