name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      # OpenApiSpecTests compares the API with the specs committed here
      - "frontend/packages/api-client/openapi/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/packages/api-client/openapi/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Tests (Testcontainers uses the runner's Docker), Spring Modulith and ArchUnit checks, Spotless
      - run: ./mvnw -B verify
