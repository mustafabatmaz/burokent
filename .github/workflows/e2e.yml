name: End-to-end

# The whole production stack plus Playwright: slower than the other checks, so it runs after merging to main and
# on demand, not on every pull request
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # Builds the images, starts the stack with random secrets, runs Playwright in its Docker image, cleans up
      - run: infra/e2e/run.sh
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          retention-days: 14
