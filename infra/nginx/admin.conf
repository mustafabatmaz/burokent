# admin-web: the single-page app's files, plus /api passed to the backend. One origin, so no CORS, and the
# session and CSRF cookies work exactly as in development (Vite's proxy).

# Behind the edge Caddy (production) the original scheme comes in X-Forwarded-Proto; directly (local try) there
# is no such header and the scheme is this connection's own
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Every request comes from Caddy over a Docker network. Trust the client address Caddy wrote, but only from
    # Docker's private ranges; Caddy itself only trusts Cloudflare's addresses for it
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    location /api/ {
        # Image uploads: the backend accepts up to 20 MB per file (nginx's default is 1 MB)
        client_max_body_size 21m;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        # Overwritten, not appended: the backend uses it for the login rate limit and the activity log, so it gets
        # exactly the one address realip settled on above
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # For uptime monitoring from outside: the backend's health (it checks the database too) and nothing else, a
    # status without component details, or 503. An exact match, so it wins over /api/ and no other actuator path is
    # reachable
    location = /api/health {
        proxy_pass http://backend:8080/actuator/health;
        add_header Cache-Control "no-store" always;
    }

    # Vite puts a content hash in every file name here, so a file never changes
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Logos and icons keep their names, so the browser checks them now and then
    location /brand/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Everything else is the app: unknown paths get index.html and React Router takes over. no-cache: the browser
    # checks for a new index.html (and so new asset names) on every visit
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
