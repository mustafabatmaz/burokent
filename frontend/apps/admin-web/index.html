<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/brand/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/brand/ikon-180.png" />
    <title>BüroKent Panel</title>
    <script>
      // Apply the stored theme before the first paint, so dark mode does not flash white
      (function () {
        var choice = "system";
        try {
          choice = localStorage.getItem("bk.theme") || "system";
        } catch (e) {}
        var dark =
          choice === "dark" || (choice === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
