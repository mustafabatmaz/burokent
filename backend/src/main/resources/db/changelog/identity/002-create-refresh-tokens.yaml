databaseChangeLog:
  - changeSet:
      id: identity-002
      author: burokent
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  generationType: ALWAYS
                  constraints:
                    primaryKey: true
                    primaryKeyName: refresh_tokens_pkey
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: refresh_tokens_user_id_fkey
                    references: users(id)
              - column:
                  name: token_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: refresh_tokens_token_hash_key
              - column:
                  name: family_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: timestamptz
              - column:
                  name: user_agent
                  type: varchar(512)
              - column:
                  name: ip
                  type: varchar(45)
        - createIndex:
            tableName: refresh_tokens
            indexName: refresh_tokens_family_id_idx
            columns:
              - column:
                  name: family_id
        - createIndex:
            tableName: refresh_tokens
            indexName: refresh_tokens_expires_at_idx
            columns:
              - column:
                  name: expires_at
