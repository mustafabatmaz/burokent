# Every table and sequence the owner creates from now on is usable by the app user with plain CRUD.
# Append-only tables revoke UPDATE and DELETE right after their own createTable.
databaseChangeLog:
  - changeSet:
      id: shared-001
      author: burokent
      changes:
        - sql:
            sql: >-
              ALTER DEFAULT PRIVILEGES FOR ROLE "${owner_user}" IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO "${app_user}";
              ALTER DEFAULT PRIVILEGES FOR ROLE "${owner_user}" IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO "${app_user}";
      rollback:
        - sql:
            sql: >-
              ALTER DEFAULT PRIVILEGES FOR ROLE "${owner_user}" IN SCHEMA public
              REVOKE SELECT, INSERT, UPDATE, DELETE ON TABLES FROM "${app_user}";
              ALTER DEFAULT PRIVILEGES FOR ROLE "${owner_user}" IN SCHEMA public
              REVOKE USAGE, SELECT ON SEQUENCES FROM "${app_user}";
