spring:
  application:
    name: burokent
  servlet:
    multipart:
      # One image per request; the media module checks the size again with its own error code
      max-file-size: 20MB
      max-request-size: 21MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    parameters:
      owner_user: ${spring.liquibase.user}
      app_user: ${spring.datasource.username}
      bootstrap_admin_username: ${BOOTSTRAP_ADMIN_USERNAME:}
      bootstrap_admin_password_hash: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:}

server:
  # Behind the proxies (edge Caddy, the admin panel's nginx) Tomcat takes the client address from
  # X-Forwarded-For, but only when the request comes from a private network, so a client cannot fake it
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    enabled: false

burokent:
  # The admin panel's start page: public exchange rates and weather (switched off in tests)
  dashboard:
    enabled: true
    # MET Norway asks every client to name itself; no personal contact details
    user-agent: "BuroKentPanel/1.0 https://burokent.com"
    rates-url: https://www.tcmb.gov.tr/kurlar/today.xml
    weather-url: https://api.met.no/weatherapi/locationforecast/2.0/compact
    # The central bank's EVDS (the key is sent in a header; see EVDS_API_KEY below)
    gold-url: https://evds3.tcmb.gov.tr/igmevdsms-dis/
    location:
      name: Antakya
      latitude: 36.2025
      longitude: 36.1606

---
spring:
  config:
    activate:
      on-profile: dev | prod
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
  liquibase:
    user: ${DB_OWNER_USER}
    password: ${DB_OWNER_PASSWORD}
burokent:
  auth:
    jwt-secret: ${JWT_SECRET}
  media:
    root: ${MEDIA_ROOT}
  dashboard:
    # Optional: without a key the start page shows no gold price
    evds-key: ${EVDS_API_KEY:}

---
spring:
  config:
    activate:
      on-profile: dev
server:
  port: 8090
springdoc:
  swagger-ui:
    enabled: true
logging:
  level:
    com.burokent: debug

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
